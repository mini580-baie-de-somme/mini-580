# Stack PROD — web only; PostgreSQL native on VPS host
# Ports: slot 02 → host 3020 (see scripts/host/vps-registry.conf)

name: mini580-prod

services:
  web:
    image: ${IMAGE:?IMAGE required}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL required}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET required}
      EDITORS_ALLOWLIST: ${EDITORS_ALLOWLIST:-}
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      SITE_URL: ${SITE_URL:-https://classmini580.blog}
      MEDIA_ROOT: /data/media
      MEDIA_PUBLIC_BASE: /media
      INGEST_API_KEY: ${INGEST_API_KEY:-}
      TELEGRAM_SERVICE_USER_EMAIL: ${TELEGRAM_SERVICE_USER_EMAIL:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      TELEGRAM_ALLOWED_USER_IDS: ${TELEGRAM_ALLOWED_USER_IDS:-}
      CURSOR_API_KEY: ${CURSOR_API_KEY:-}
      CURSOR_MODEL: ${CURSOR_MODEL:-composer-2.5}
      CURSOR_CWD: ${CURSOR_CWD:-/tmp/mini580-cursor}
      HOME: /tmp
      INTERNAL_API_BASE: http://127.0.0.1:3000
      SYNC_ENV: ${SYNC_ENV:-prod}
      SYNC_PEER_URL: ${SYNC_PEER_URL:-https://test.classmini580.blog}
      SYNC_PRIVATE_KEY: ${SYNC_PRIVATE_KEY:-}
      SYNC_PEER_PUBLIC_KEY: ${SYNC_PEER_PUBLIC_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NEXT_PUBLIC_LOG_LEVEL: ${NEXT_PUBLIC_LOG_LEVEL:-info}
    ports:
      - "127.0.0.1:3020:3000"
    volumes:
      - ./media:/data/media
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "test.classmini580.blog:2.24.13.70"
    networks:
      - mini580_prod

networks:
  mini580_prod:
    name: mini580_prod
