name: Ops — Fetch VPS logs

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Stack (test or prod)"
        required: true
        type: choice
        options:
          - prod
          - test
        default: prod
      tail:
        description: "Log lines to fetch"
        required: false
        default: "2000"

jobs:
  fetch-logs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Fetch container logs and media diagnostics
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          OPS_ENV: ${{ inputs.environment }}
          LOG_TAIL: ${{ inputs.tail }}
        run: |
          set -euo pipefail
          SSH_OPTS=(
            -i ~/.ssh/deploy_key
            -o BatchMode=yes
            -o ConnectTimeout=45
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=4
          )
          attempt=1
          max=3
          while [[ "$attempt" -le "$max" ]]; do
            echo "==> SSH attempt $attempt/$max"
            if OPS_ENV="$OPS_ENV" LOG_TAIL="$LOG_TAIL" \
              ssh "${SSH_OPTS[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash -s' \
              < deploy/scripts/fetch-logs-remote.sh; then
              echo "OK"
              exit 0
            fi
            if [[ "$attempt" -lt "$max" ]]; then
              echo "Attempt $attempt failed — retrying in 15s..."
              sleep 15
            fi
            attempt=$((attempt + 1))
          done
          echo "::error::SSH to VPS failed after $max attempts (timeout or network)"
          exit 1
