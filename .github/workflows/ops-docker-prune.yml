name: Ops — Docker prune VPS

on:
  workflow_dispatch:

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync cleanup script to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 120s
          command_timeout: 5m
          source: "deploy/scripts/docker-cleanup.sh"
          target: "/tmp/mini580-deploy-sync"

      - name: Free disk — unused Docker images and build cache
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 120s
          command_timeout: 15m
          script: |
            set -euo pipefail
            mkdir -p /opt/mini580/bin
            cp /tmp/mini580-deploy-sync/deploy/scripts/docker-cleanup.sh /opt/mini580/bin/docker-cleanup.sh
            chmod +x /opt/mini580/bin/docker-cleanup.sh
            /opt/mini580/bin/docker-cleanup.sh
